<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kho Bài Tập Toán 2</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Quicksand:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFBEB;
    --text: #1E293B;
    --muted: #64748B;
    --border-soft: #FDE68A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }

  .wrap { max-width: 1020px; margin: 0 auto; }

  /* Thanh tiêu đề & tìm kiếm */
  .top-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    background: #FFFFFF;
    padding: 16px 20px;
    border-radius: 22px;
    border: 2.5px solid var(--border-soft);
    box-shadow: 0 6px 18px rgba(245, 158, 11, 0.1);
  }

  .title-group h2 {
    font-family: 'Quicksand', sans-serif;
    color: #B45309;
    font-size: 1.45rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .count-badge {
    font-size: 0.85rem;
    font-weight: 800;
    color: #92400E;
    background: #FEF3C7;
    padding: 4px 12px;
    border-radius: 999px;
    display: inline-block;
    margin-top: 6px;
  }

  .search-wrap {
    display: flex;
    gap: 8px;
    flex: 1;
    min-width: 230px;
    max-width: 360px;
  }

  .search-wrap input {
    flex: 1;
    padding: 10px 16px;
    border-radius: 14px;
    border: 2.5px solid var(--border-soft);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-wrap input:focus {
    border-color: #F97316;
    box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
  }

  .btn-reload {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    border: 2.5px solid var(--border-soft);
    background: #FFF7ED;
    font-size: 1.1rem;
    cursor: pointer;
    transition: transform 0.15s, background 0.2s;
  }

  .btn-reload:hover { background: #FFEDD5; }
  .btn-reload:active { transform: scale(0.92); }

  /* Lưới nút bấm 3D */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
    gap: 16px;
  }

  .ex-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 16px;
    border-radius: 18px;
    text-decoration: none;
    color: #FFFFFF;
    font-weight: 800;
    font-size: 1rem;
    border: 2px solid transparent;
    transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.15s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .ex-btn:hover {
    transform: translateY(-3px);
    filter: brightness(1.04);
  }

  .ex-btn:active {
    transform: translateY(3px);
  }

  /* 4 tông màu nút bấm luân phiên đồng bộ giao diện */
  .theme-0 {
    background: linear-gradient(135deg, #FBBF24, #F97316);
    border-color: #F59E0B;
    box-shadow: 0 5px 0 #C2410C, 0 8px 16px rgba(249, 115, 22, 0.22);
  }
  .theme-0:active { box-shadow: 0 2px 0 #C2410C; }

  .theme-1 {
    background: linear-gradient(135deg, #38BDF8, #3B82F6);
    border-color: #2563EB;
    box-shadow: 0 5px 0 #1D4ED8, 0 8px 16px rgba(59, 130, 246, 0.22);
  }
  .theme-1:active { box-shadow: 0 2px 0 #1D4ED8; }

  .theme-2 {
    background: linear-gradient(135deg, #34D399, #10B981);
    border-color: #059669;
    box-shadow: 0 5px 0 #047857, 0 8px 16px rgba(16, 185, 129, 0.22);
  }
  .theme-2:active { box-shadow: 0 2px 0 #047857; }

  .theme-3 {
    background: linear-gradient(135deg, #F472B6, #EC4899);
    border-color: #DB2777;
    box-shadow: 0 5px 0 #BE185D, 0 8px 16px rgba(236, 72, 153, 0.22);
  }
  .theme-3:active { box-shadow: 0 2px 0 #BE185D; }

  .ex-badge {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 13px;
    background: rgba(255, 255, 255, 0.24);
    border: 2px solid rgba(255, 255, 255, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Quicksand', sans-serif;
    font-size: 1.15rem;
    font-weight: 800;
    color: #FFFFFF;
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }

  .ex-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .ex-folder {
    font-size: 0.72rem;
    font-weight: 800;
    opacity: 0.9;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .ex-title {
    font-size: 1.02rem;
    font-weight: 900;
    line-height: 1.3;
    text-shadow: 0 1px 2px rgba(0,0,0,0.12);
    word-break: break-word;
  }

  .ex-arrow {
    font-size: 1.15rem;
    opacity: 0.9;
    transition: transform 0.15s;
  }

  .ex-btn:hover .ex-arrow {
    transform: translateX(3px);
  }

  .status {
    text-align: center;
    padding: 32px 16px;
    font-weight: 700;
    color: var(--muted);
    background: #FFFFFF;
    border-radius: 18px;
    border: 2.5px dashed var(--border-soft);
    line-height: 1.6;
  }

  .retry-btn {
    margin-top: 12px;
    padding: 9px 18px;
    border: none;
    border-radius: 12px;
    background: #F97316;
    color: #FFFFFF;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <div class="title-group">
      <h2>🧮 Kho Bài Tập Toán 2</h2>
      <span class="count-badge" id="countBadge">Đang tải danh sách...</span>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="🔍 Tìm tuần học (vd: tuần 1)..." oninput="filterList()">
      <button class="btn-reload" title="Tải lại danh sách mới nhất" onclick="loadExercises(true)">🔄</button>
    </div>
  </div>

  <div id="listContainer" class="status">⏳ Đang kết nối tới GitHub...</div>
</div>

<script>
  const GITHUB_USER = 'tuhoccungcon';
  const GITHUB_REPO = 'toan2';
  const CACHE_KEY = 'gh_list_v2_' + GITHUB_USER + '_' + GITHUB_REPO;

  let allFiles = [];

  async function fetchWithTimeout(url, ms = 10000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try {
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      return res;
    } catch (e) {
      clearTimeout(timer);
      throw e;
    }
  }

  async function loadExercises(forceReload = false) {
    const container = document.getElementById('listContainer');
    const badge = document.getElementById('countBadge');

    if (!forceReload) {
      try {
        const cached = sessionStorage.getItem(CACHE_KEY);
        if (cached) {
          allFiles = JSON.parse(cached);
          if (allFiles.length > 0) {
            renderList(allFiles);
            return;
          }
        }
      } catch (e) {}
    }

    badge.textContent = 'Đang tải danh sách...';
    container.className = 'status';
    container.textContent = '⏳ Đang kết nối tới GitHub...';

    const endpoints = [
      { type: 'tree', url: `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/main?recursive=1` },
      { type: 'tree', url: `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/master?recursive=1` },
      { type: 'contents', url: `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/` }
    ];

    let items = null;
    let lastError = '';

    for (const ep of endpoints) {
      try {
        const res = await fetchWithTimeout(ep.url, 10000);
        if (!res.ok) {
          lastError = `Mã lỗi HTTP ${res.status}`;
          continue;
        }
        const data = await res.json();
        if (ep.type === 'tree' && Array.isArray(data.tree)) {
          items = data.tree
            .filter(i => i.type === 'blob')
            .map(i => ({ path: i.path, name: i.path.split('/').pop() }));
          break;
        }
        if (ep.type === 'contents' && Array.isArray(data)) {
          items = data
            .filter(i => i.type === 'file')
            .map(i => ({ path: i.path, name: i.name }));
          break;
        }
      } catch (err) {
        lastError = err.name === 'AbortError' ? 'Hết thời gian chờ kết nối' : err.message;
      }
    }

    if (!items) {
      badge.textContent = 'Lỗi kết nối';
      container.className = 'status';
      container.innerHTML = `
        ⚠️ Không tải được danh sách (${escapeHtml(lastError)}).<br>
        Hãy kiểm tra kho <b>${GITHUB_REPO}</b> đang ở chế độ <b>Public</b>.<br>
        <button class="retry-btn" onclick="loadExercises(true)">🔄 Thử lại</button>
      `;
      return;
    }

    allFiles = items
      .filter(item => /\.html?$/i.test(item.name) && item.name.toLowerCase() !== 'index.html')
      .sort((a, b) => a.path.localeCompare(b.path, 'vi', { numeric: true, sensitivity: 'base' }));

    try {
      sessionStorage.setItem(CACHE_KEY, JSON.stringify(allFiles));
    } catch (e) {}

    if (allFiles.length === 0) {
      badge.textContent = '0 bài tập';
      container.className = 'status';
      container.textContent = 'Chưa tìm thấy file bài tập (.html) nào trong kho toan2.';
      return;
    }

    renderList(allFiles);
  }

  // Tự động đổi tên file sang tiêu đề tiếng Việt đẹp mắt
  function formatTitle(filename) {
    const clean = filename.replace(/\.html?$/i, '').trim();

    // Dạng Week-01, Week_1, Week 01, Tuan-01 -> Bài tập tuần 1
    const weekMatch = clean.match(/^(?:week|tu[aầ]n)[\s_-]*0*(\d+)(?:[\s_-]+(.*))?$/i);
    if (weekMatch) {
      const num = weekMatch[1];
      const extra = weekMatch[2] ? ' – ' + weekMatch[2].replace(/[-_]+/g, ' ').trim() : '';
      return `Bài tập tuần ${num}${extra}`;
    }

    // Dạng Bai-01, Lesson-01 -> Bài tập 1
    const baiMatch = clean.match(/^(?:bai|bài|lesson|unit)[\s_-]*0*(\d+)(?:[\s_-]+(.*))?$/i);
    if (baiMatch) {
      const num = baiMatch[1];
      const extra = baiMatch[2] ? ' – ' + baiMatch[2].replace(/[-_]+/g, ' ').trim() : '';
      return `Bài tập ${num}${extra}`;
    }

    // Dạng De-01, Test-01 -> Đề kiểm tra 1
    const testMatch = clean.match(/^(?:de|đề|test)[\s_-]*0*(\d+)(?:[\s_-]+(.*))?$/i);
    if (testMatch) {
      const num = testMatch[1];
      const extra = testMatch[2] ? ' – ' + testMatch[2].replace(/[-_]+/g, ' ').trim() : '';
      return `Đề kiểm tra ${num}${extra}`;
    }

    return clean.replace(/[-_]+/g, ' ').trim();
  }

  // Lấy số thứ tự nổi bật trên huy hiệu nút bấm
  function getBadgeText(filename, fallbackIdx) {
    const numMatch = filename.match(/0*(\d+)/);
    return numMatch ? numMatch[1] : String(fallbackIdx + 1);
  }

  function getFolderLabel(filePath) {
    const parts = filePath.split('/');
    if (parts.length <= 1) return '';
    return parts.slice(0, -1).join(' / ').replace(/[-_]+/g, ' ');
  }

  function buildPageUrl(filePath) {
    const encodedPath = filePath.split('/').map(encodeURIComponent).join('/');
    return `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/${encodedPath}`;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function renderList(files) {
    const container = document.getElementById('listContainer');
    const badge = document.getElementById('countBadge');
    badge.textContent = `⭐ ${files.length} bài tập sẵn sàng`;

    if (files.length === 0) {
      container.className = 'status';
      container.textContent = 'Không tìm thấy bài tập nào khớp với từ khóa.';
      return;
    }

    container.className = 'grid';
    container.innerHTML = files.map((file, idx) => {
      const folder = getFolderLabel(file.path);
      const title = formatTitle(file.name);
      const badgeNum = getBadgeText(file.name, idx);
      const themeClass = 'theme-' + (idx % 4);

      return `
        <a class="ex-btn ${themeClass}" href="${buildPageUrl(file.path)}" target="_blank" rel="noopener noreferrer">
          <div class="ex-badge">${escapeHtml(badgeNum)}</div>
          <div class="ex-info">
            ${folder ? `<span class="ex-folder">📁 ${escapeHtml(folder)}</span>` : ''}
            <span class="ex-title">${escapeHtml(title)}</span>
          </div>
          <span class="ex-arrow">▶</span>
        </a>
      `;
    }).join('');
  }

  function filterList() {
    const kw = document.getElementById('searchInput').value.toLowerCase().trim();
    const filtered = allFiles.filter(f =>
      formatTitle(f.name).toLowerCase().includes(kw) ||
      f.name.toLowerCase().includes(kw) ||
      getFolderLabel(f.path).toLowerCase().includes(kw)
    );
    renderList(filtered);
  }

  loadExercises();
</script>
</body>
</html>
